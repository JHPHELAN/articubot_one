#
# See /opt/ros/jazzy/share/teleop_twist_joy/config/xbox.config.yaml
#

#joy_node:
#  ros__parameters:
#    device_id: 0
#    deadzone: 0.05
#    autorepeat_rate: 20.0

teleop_twist_joy_node:
  ros__parameters:
    axis_linear:  # Left thumb stick vertical
      x: 1
    scale_linear:
      x: 0.1
    scale_linear_turbo:
      x: 0.5

    axis_angular:  # Right thumb stick horizontal
      yaw: 3
    scale_angular:
      yaw: 0.5

    # teleop_twist_joy:teleop_node will block /cmd_vel_joy unless one of these buttons are held:
    enable_button: 4        # Left bumper (LB)
    enable_turbo_button: 5  # Right bumper (RB)

    require_enable_button: true
