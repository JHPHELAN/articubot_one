indicators_node:
  ros__parameters:
    # GPIO (BCM numbering)
    headlights_pin: 17           # header pin 11
    beacon_pin: 22               # header pin 15 (LED)
    # empty_pin: 27              # header pin 13
    headlights_active_low: false # direct IRLZ44N MOSFET
    beacon_active_low: false     # direct IRLZ44N MOSFET

    # LED blink pattern when beacon is active (seconds).
    beacon_led_on_sec: 1.0       # LED turn-signal cadence
    beacon_led_off_sec: 0.800

    # Audio warning (replaces GPIO 22 piezo buzzer).
    # Played via `aplay` through the USB audio dongle.
    beacon_sound_path: "/home/ubuntu/wav/klingon_alert.wav"
    beacon_sound_repeat_sec: 3.6 # klingon_alert_LOUD.wav length (two-tone clip); matches two LED cycles at 1.0/0.8
    beacon_sound_device: ""      # empty = aplay default; e.g. "plughw:CARD=Device,DEV=0"

    # Topics
    joy_topic: "/joy"
    cmd_vel_topic: "/cmd_vel"

    # Joystick buttons (Xbox layout)
    headlights_on_button: 0      # A (green)
    headlights_off_button: 1     # B (red)
    beacon_manual_button: 3      # Y (yellow) - toggles flashing lights only
    beacon_sound_button: 2       # X (blue)   - toggles beacon sound enable
    beacon_sound_default_on: false  # start with beacon sound muted

    # Motion detection
    linear_threshold: 0.01       # m/s
    angular_threshold: 0.05      # rad/s
    beacon_linger_sec: 2.0       # keep beacon on this long after motion stops

    # Boot "running light": headlights stay on this long after node start, then off.
    # With the direct-MOSFET PCB, hardware default (Pi off, or before node starts) is
    # bulbs OFF. The node turns them ON at start and back OFF after this delay so the
    # robot has a brief visible "I'm awake" cue during boot.
    # Set to 0.0 to skip the running-light behavior and start with bulbs OFF.
    headlights_startup_on_sec: 3.0

    # Nav2 trouble alert (plays danger.wav when Stormy is actually stuck).
    #
    # "Stuck" is defined as a *burst* of physical BT recoveries -- N of them
    # within a time window -- not a single one. Rationale: Nav2 fires a
    # one-off Spin or BackUp all the time as normal self-recovery from
    # transient bumps against inflated obstacles. That is NOT stuck. Only
    # when the robot is repeatedly reaching for physical recoveries within
    # a short window is it genuinely in trouble.
    #
    # ClearCostmap / Wait are intentionally NOT in the recovery list. They
    # are mild, routine, and used to flood the speaker.
    #
    # Goal-aborted alerting is OFF by default: during exploration an
    # ABORTED goal just means the frontier picker moves on to the next
    # candidate -- routine, not stuck. Set alert_on_goal_aborted:true to
    # opt back in (single aborts will still be alerts if you do).
    #
    # alert_min_interval_sec is an *additional* throttle so back-to-back
    # stuck bursts still play at most one clip per interval.
    alert_sound_path: "/home/ubuntu/wav/danger.wav"
    alert_sound_device: ""             # empty = follow beacon_sound_device
    alert_min_interval_sec: 8.0        # min seconds between actual audio plays
    alert_on_goal_aborted: false       # exploration: aborts are routine
    alert_on_recovery: true            # subscribe to /behavior_tree_log
    alert_recovery_count_threshold: 3  # N recoveries in the window = STUCK
    alert_recovery_count_window_sec: 30.0
    bt_log_topic: "/behavior_tree_log"
    nav_status_topic: "/navigate_to_pose/_action/status"
    alert_recovery_node_names:         # substring match against BT node_name
      - "Spin"                         # physical: yaw-in-place recovery
      - "BackUp"                       # physical: reverse recovery
      # Deliberately excluded (mild/routine, not "stuck"):
      #   - ClearEntireCostmap / ClearLocalCostmap / ClearGlobalCostmap
      #   - Wait

    mock_gpio: false             # set true for non-Pi test
