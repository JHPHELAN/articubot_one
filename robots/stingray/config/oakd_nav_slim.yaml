# OAK-D minimal config for navigation use only.
# Goal: publish a single depth pointcloud and nothing else, so Nav2 can use it
# as an obstacle source for low/high obstacles invisible to the LD19 lidar.
#
# Disabled: RGB topics, neural network, OAK-D IMU (BNO085 is the IMU of record).
# Reduced: stereo resolution and FPS to keep Pi 5 CPU and USB bandwidth happy.
/oak:
  ros__parameters:
    camera:
      i_pipeline_type: RGBD         # RGBD reliably publishes depth; RGB suppressed via launch arg enable_color:=false
      i_nn_type: none
      i_enable_imu: false
      i_enable_ir: true             # IR projector helps depth on plain surfaces
    imu:
      i_publish_topic: false
    left:
      i_publish_topic: false
    right:
      i_publish_topic: false
    rgb:
      i_publish_topic: true
      i_low_bandwidth: true         # camera publishes JPEG-compressed frames; CPU near zero
      i_low_bandwidth_quality: 50   # 50 is fine for monitoring
      # 2026-06-14: dropped 720P->400P to match stereo res; lower latency for tele-nav,
      # and avoids the RGB(720)/depth(400) dim mismatch that crashed point_cloud_xyzrgb_node.
      i_resolution: '400P'
      i_fps: 5.0
      # Keep DepthAI device clock aligned with ROS time so message stamps
      # don't drift past the TF cache ("earlier than all data in transform cache").
      i_update_ros_base_time_on_ros_msg: true
    stereo:
      i_align_depth: true           # depth in RGB frame; silences frame-id warning
      i_subpixel: false
      i_publish_topic: true         # depth image at /oak/stereo/image_raw
      i_low_bandwidth: false        # raw is cheaper on CPU than host-side encoding
      i_resolution: '400P'
      i_fps: 5.0
      i_left_rect_publish_topic: false
      i_right_rect_publish_topic: false
      i_update_ros_base_time_on_ros_msg: true
      # 2026-06-14: cap depth at the source (~3 m). Stereo noise grows as r^2;
      # beyond ~3 m we get ghosts. Nav2 already truncates to 2 m for the
      # obstacle layer, but Rviz shows the raw cloud — this caps both.
      # Units: millimetres (DepthAI convention).
      i_enable_threshold_filter: true
      i_threshold_filter_min_range: 200    # 0.20 m, matches obstacle_min_range
      i_threshold_filter_max_range: 3000   # 3.00 m
