# Stingray BNO085 config
# See https://github.com/bnbhat/bno08x_ros2_driver
#     https://github.com/slgrobotics/bno08x_ros2_driver  (improved fork)
#     https://github.com/slgrobotics/robots_bringup/blob/main/Docs/Sensors/BNO085%20IMU.md
#
bno08x_driver:
  ros__parameters:

    frame_id: "imu_link"  # Match the existing frame_id

    # Chassis, motors, and USB WiFi antenna prevent SH-2 mag calibration → 9-DOF
    # (default) stalls waiting for mag. Use 6-DOF (accel+gyro) orientation.
    enable_6dof_mode: true

    # Disable magnetometer — use SH2_GAME_ROTATION_VECTOR (relative orientation)
    # instead of SH2_ROTATION_VECTOR (absolute/magnetic north)
    imu:
      use_magnetometer: false
      orientation_yaw_variance: 0.005

    # Communication Interface
    i2c:
      enabled: true
      bus: "/dev/i2c-1"
      address: "0x4A"

    publish:
      magnetic_field: 
        enabled: false  # Not used - GAME_ROTATION_VECTOR ignores magnetometer. Disabling to reduce I2C load.
        rate: 10
      imu:
        enabled: true
        rate: 50    # EKF runs at 30Hz; 50Hz is sufficient and halves I2C traffic vs 100Hz
